name: Docker image

# Publishes ghcr.io/ergo35/lyra for amd64 and arm64 when a release tag is pushed (see
# RELEASING.md). Each architecture builds natively on its own runner, then one job merges
# them into a multi-arch tag. Pull requests that touch the image only build it.
on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "senpai" ]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ergo35/lyra  # registry names must be lowercase
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to GHCR
      if: env.PUSH == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.IMAGE }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
        cache-from: type=gha,scope=${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
    - name: Save the digest
      if: env.PUSH == 'true'
      run: |
        mkdir -p digests
        touch "digests/${DIGEST#sha256:}"
        echo "ARTIFACT=digest-${PLATFORM//\//-}" >> "$GITHUB_ENV"
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        PLATFORM: ${{ matrix.platform }}
    - if: env.PUSH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT }}
        path: digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: digests
        pattern: digest-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=ref,event=branch
    - name: Create the multi-arch tags
      working-directory: digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf "$IMAGE@sha256:%s " *)
    - name: Inspect
      run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
