name: Bug report
description: Something in Lyra does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Never paste your `DISCORD_TOKEN`.
        Security problems should be reported privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands you ran (for example `!play <url>` or `/queue`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lyra version
      description: Release tag or commit (for example `v0.11.2`).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Lyra?
      options:
        - Release installer / prebuilt binary
        - cargo build from source
        - Other
    validations:
      required: true
  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      description: Output of `yt-dlp --version` (relevant for music commands).
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 x86_64
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Run with `RUST_LOG=debug` for more detail. Remove any secrets.
      render: shell
